apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    project: roboshop
    tier: frontend
    component: frontend
  annotations:
    kubernetes.io/change-cause: "moving to 1.29"  
spec:
  replicas: 4
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend  
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend  
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey:  topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule  #ScheduleAnyway is soft rule 
        labelSelector:
          matchLabels:
            project: roboshop
            tier: frontend
            component: frontend 
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule  #ScheduleAnyway is soft rule 
        labelSelector:
          matchLabels:
            project: roboshop
            tier: frontend
            component: frontend        
      containers:
        - name: nginx 
          image: nginx:1.29
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx
spec:
  minAvailable: "40%"
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend          